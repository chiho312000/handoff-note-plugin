name: handoff-notes
version: 0.8.2
description: >
  Archives the handoff summary Hermes writes each time it compresses a
  conversation, as a Markdown note under this profile's handoffs/<date>/ folder.
  From the 2nd compaction the agent appends a handoff and the chat continues from it
  in the same session (a gateway without a session authority moves messaging chats
  to a new session instead).
author: local
kind: standalone
provides_hooks:
  - post_auxiliary_call
  - post_compaction
  - pre_tool_call
  - transform_tool_result
  - pre_llm_call
  - post_llm_call
  - pre_gateway_dispatch
